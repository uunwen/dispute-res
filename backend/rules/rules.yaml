# Deterministic dispute-resolution rules, aligned to the organizer's
# "Ryde Dispute Resolution Policy v2.1" (see backend/policies/*.md).
#
# EXTENSION POINT: add new rules by appending entries to this list. Each rule
# needs:
#   id         - unique string identifier
#   category   - the dispute category this rule applies to (route_deviation,
#                no_show, fare_dispute, property_damage, safety_incident)
#   citation   - the v2.1 policy section the rule implements (e.g. "2.3")
#   conditions - a safe boolean expression over the evidence context (evaluated
#                without eval(); only arithmetic, comparison, boolean operators
#                and the functions min/max/abs/round are allowed)
#   outcome    - no_action | partial_refund | full_refund
#   amount     - a numeric expression for the refund, evaluated with the same
#                safe evaluator
#
# Rules are evaluated in order and the first matching rule wins.
#
# Facts referenced here come from two evidence layers: the raw-case facts
# (app/evidence/case_facts.py: traffic_justified, deviation_notified,
# excess_distance_fare, contact_obligation_met, surge_increased, rider_notified,
# surge_differential) and the GPS/fare evidence (extra_distance_km, traffic_signal,
# driver_arrived, wait_duration_min, fee, fare, total_km).
rules:
  # --- Route deviation (Policy v2.1 Section 1) ---
  # `deviation_km` is the authoritative meter/odometer deviation when a case
  # carries a raw_case; otherwise we fall back to the GPS-derived extra distance.
  # `traffic_justified` (raw_case) overrides the route.py `traffic_signal` speed
  # heuristic whenever it is present; `!= None` distinguishes "no traffic" from
  # "no raw_case, fall back to the heuristic".

  # 1.3 within tolerance (deviation <= 1km) -> no refund.
  - id: route_deviation_minor
    category: route_deviation
    citation: "1.3"
    conditions: "(deviation_km if deviation_km else extra_distance_km) <= 1"
    outcome: no_action
    amount: "0"

  # 1.3 deviation > 1km with no traffic justification -> full refund of the
  # excess distance fare. For cases with a raw_case the authoritative excess
  # distance fare is used; otherwise a proportional proxy remains a placeholder.
  - id: route_deviation_major
    category: route_deviation
    citation: "1.3"
    conditions: "(deviation_km if deviation_km else extra_distance_km) > 1 and not (traffic_justified if traffic_justified != None else traffic_signal)"
    outcome: full_refund
    amount: "excess_distance_fare if excess_distance_fare > 0 else fare * min(1, extra_distance_km / total_km)"

  # 1.3 traffic-justified deviation > 1km but rider not notified -> partial refund.
  - id: route_deviation_traffic
    category: route_deviation
    citation: "1.2"
    conditions: "(deviation_km if deviation_km else extra_distance_km) > 1 and (traffic_justified if traffic_justified != None else traffic_signal) and not deviation_notified"
    outcome: partial_refund
    amount: "excess_distance_fare if excess_distance_fare > 0 else fare * min(1, extra_distance_km / total_km)"

  # 1.3 traffic-justified deviation > 1km and rider notified -> no refund.
  - id: route_deviation_notified
    category: route_deviation
    citation: "1.2"
    conditions: "(deviation_km if deviation_km else extra_distance_km) > 1 and (traffic_justified if traffic_justified != None else traffic_signal) and deviation_notified"
    outcome: no_action
    amount: "0"

  # --- No-show / cancellation fee (Policy v2.1 Section 2) ---

  # 2.4 Driver failed to arrive (scheduled pickup + 5 min) -> refund the fee.
  - id: no_show_driver_never_arrived
    category: no_show
    citation: "2.4"
    conditions: "not driver_arrived"
    outcome: full_refund
    amount: "fee"

  # 2.3 Contact obligation: at least 1 chat message AND 1 call before cancelling,
  # otherwise the fee is voided.
  - id: no_show_contact_obligation_violated
    category: no_show
    citation: "2.3"
    conditions: "driver_arrived and not contact_obligation_met"
    outcome: full_refund
    amount: "fee"

  # 2.1 Cancelled before the free wait elapsed -> the fee is refunded.
  - id: no_show_early_cancellation
    category: no_show
    citation: "2.1"
    conditions: "driver_arrived and contact_obligation_met and (wait_min if wait_min else wait_duration_min) < 5"
    outcome: full_refund
    amount: "fee"

  # 2.1/2.2 Driver waited the free 5 minutes and met the contact obligation ->
  # the fee stands.
  - id: no_show_rider_waited
    category: no_show
    citation: "2.1"
    conditions: "driver_arrived and contact_obligation_met and (wait_min if wait_min else wait_duration_min) >= 5"
    outcome: no_action
    amount: "0"

  # --- Fare / surge (Policy v2.1 Section 3) ---

  # 3.3 Surge increase without notification -> full refund of the surge
  # differential (actual - quote). Booking fee is surge-exempt (3.5).
  - id: surge_increase_not_notified
    category: fare_dispute
    citation: "3.3"
    conditions: "surge_increased and not rider_notified and surge_differential > 0"
    outcome: full_refund
    amount: "surge_differential"
